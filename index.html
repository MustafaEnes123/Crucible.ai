<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crucible.ai v2.0 — Closed-Loop Adversarial Verification Runtime</title>
    <meta
      name="description"
      content="Crucible.ai — The Adversarial Verification Runtime for Autonomous AI Agents. Builder, red-team prosecutor, deterministic gate and chief judge in one closed loop."
    />
    <meta name="theme-color" content="#FDC800" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%23FDC800' stroke='%231C293C' stroke-width='3'/%3E%3Ctext x='16' y='23' font-family='Inter,Arial' font-weight='900' font-size='20' text-anchor='middle' fill='%231C293C'%3EC%3C/text%3E%3C/svg%3E"
    />
    <!-- Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Neobrutalism tokens, keyframes and custom controls -->
    <link rel="stylesheet" href="./src/theme.css" />
    <!-- Tailwind CSS CDN (mirrors tailwind.config.js) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'],
              mono: ['"JetBrains Mono"', '"Fira Code"', 'ui-monospace', 'Consolas', 'monospace'],
            },
            colors: {
              primary: '#FDC800',
              secondary: '#432DD7',
              success: '#16A34A',
              warning: '#D97706',
              danger: '#DC2626',
              night: '#1C293C',
              surface: 'var(--surface)',
              card: 'var(--card)',
              ink: 'var(--ink)',
              muted: 'var(--muted)',
              soft: 'var(--soft)',
              accent: 'var(--accent)',
              'primary-soft': 'var(--primary-soft)',
              'secondary-soft': 'var(--secondary-soft)',
              'success-soft': 'var(--success-soft)',
              'warning-soft': 'var(--warning-soft)',
              'danger-soft': 'var(--danger-soft)',
            },
            boxShadow: {
              'nb-sm': '2px 2px 0 0 var(--ink)',
              nb: '4px 4px 0 0 var(--ink)',
              'nb-lg': '6px 6px 0 0 var(--ink)',
            },
          },
        },
      };
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem('crucible_v2_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <!-- React 18 UMD for direct execution -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Crucible.ai needs JavaScript enabled.</noscript>
    <script src="./dist/crucible-bundle.js"></script>
  </body>
</html>
